services:
  - type: web
    name: se-product-assistant-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    initialDeployHook: python -m app.bootstrap_production
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: se-product-assistant-db
          property: connectionString
      - key: DEMO_USERNAME
        value: se-demo
      - key: DEMO_PASSWORD
        sync: false

databases:
  - name: se-product-assistant-db
    plan: free
    region: frankfurt
